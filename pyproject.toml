[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "labshot"
version = "1.0.0"
description = "Real Terminal Lab Screenshot Recorder for Linux university labs"
readme = "README.md"
authors = [{ name = "CS345 Student" }]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
labshot = "labshot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
